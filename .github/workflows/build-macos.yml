name: Build macOS

on:
  workflow_dispatch:  # Manuel tetikleme için
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Build macOS app
      run: flutter build macos --release
      
    - name: Create DMG (optional)
      run: |
        cd build/macos/Build/Products/Release
        hdiutil create -volname "Kutuphane Masaustu" -srcfolder "kutuphane_masaustu.app" -ov -format UDZO "kutuphane_masaustu.dmg"
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: |
          build/macos/Build/Products/Release/kutuphane_masaustu.app
          build/macos/Build/Products/Release/kutuphane_masaustu.dmg
        retention-days: 30

