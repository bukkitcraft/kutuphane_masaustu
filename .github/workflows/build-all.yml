name: Build All Platforms

on:
  workflow_dispatch:  # Manuel tetikleme için
  push:
    branches: [ main, master ]
    tags:
      - 'v*'  # Tag ile release build
  pull_request:
    branches: [ main, master ]

jobs:
  build-all:
    strategy:
      matrix:
        platform: [windows, linux, macos]
        include:
          - platform: windows
            os: windows-latest
            build-command: flutter build windows --release
          - platform: linux
            os: ubuntu-latest
            build-command: flutter build linux --release
          - platform: macos
            os: macos-latest
            build-command: flutter build macos --release
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Install dependencies
      run: flutter pub get
      
    - name: Install platform dependencies (Linux)
      if: matrix.platform == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      
    - name: Build app
      run: ${{ matrix.build-command }}
      
    - name: Package Windows
      if: matrix.platform == 'windows'
      shell: powershell
      run: |
        $appPath = "build\windows\x64\runner\Release"
        $zipPath = "kutuphane_masaustu-windows.zip"
        Compress-Archive -Path "$appPath\*" -DestinationPath $zipPath -Force
      
    - name: Package Linux
      if: matrix.platform == 'linux'
      run: |
        cd build/linux/x64/release/bundle
        tar -czf ../../../../kutuphane_masaustu-linux.tar.gz *
      
    - name: Package macOS
      if: matrix.platform == 'macos'
      run: |
        cd build/macos/Build/Products/Release
        hdiutil create -volname "Kutuphane Masaustu" -srcfolder "kutuphane_masaustu.app" -ov -format UDZO "kutuphane_masaustu.dmg"
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.platform }}-build
        path: |
          ${{ matrix.platform == 'windows' && 'build/windows/x64/runner/Release/**' || '' }}
          ${{ matrix.platform == 'windows' && 'kutuphane_masaustu-windows.zip' || '' }}
          ${{ matrix.platform == 'linux' && 'build/linux/x64/release/bundle/**' || '' }}
          ${{ matrix.platform == 'linux' && 'build/linux/x64/release/kutuphane_masaustu-linux.tar.gz' || '' }}
          ${{ matrix.platform == 'macos' && 'build/macos/Build/Products/Release/kutuphane_masaustu.app' || '' }}
          ${{ matrix.platform == 'macos' && 'build/macos/Build/Products/Release/kutuphane_masaustu.dmg' || '' }}
        retention-days: 30

